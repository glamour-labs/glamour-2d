packages:
  - "packages/*"
  - "apps/*"
  - "skills/*"
  - "examples/*"

# pnpm (v9+) blocks postinstall/native build scripts by default. These two
# genuinely need to build: canvas (headless renderer, Node-ABI native binary)
# and esbuild (tsup/vite fetch a platform binary).
onlyBuiltDependencies:
  - canvas
  - esbuild
