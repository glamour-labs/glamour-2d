packages:
  - "packages/*"
  - "apps/*"
  - "skills/*"
  - "examples/*"

# pnpm (v9+) blocks postinstall/native build scripts by default. v2 dropped the
# native `canvas` package with Konva — headless render is a real browser now — so
# only esbuild (tsup/vite fetch a platform binary) needs pre-approval.
onlyBuiltDependencies:
  - esbuild
