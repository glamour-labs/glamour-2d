<script>
const GEO = JSON.parse(document.getElementById('geo').textContent);

/* ---------- shaders: everything is pre-tessellated triangles with a per-vertex colour ---------- */
const VS = `#version 300 es
in vec2 a_pos;
in vec4 a_col;
uniform vec2 u_res;
out vec4 v_col;
void main() {
  vec2 clip = (a_pos / u_res) * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
  v_col = a_col;
}`;

const FS = `#version 300 es
precision mediump float;
in vec4 v_col;
out vec4 outColor;
void main() { outColor = vec4(v_col.rgb * v_col.a, v_col.a); }`;

/* ---------- geometry helpers: this is the part Konva hands you for free ---------- */

// A mesh accumulates triangles as interleaved [x, y, r, g, b, a].
class Mesh {
  constructor() { this.v = []; }
  clear() { this.v.length = 0; }
  vert(x, y, c) { this.v.push(x, y, c[0], c[1], c[2], c[3]); }
  tri(ax, ay, bx, by, cx, cy, c) { this.vert(ax, ay, c); this.vert(bx, by, c); this.vert(cx, cy, c); }
  quad(ax, ay, bx, by, cx, cy, dx, dy, c) {
    this.tri(ax, ay, bx, by, cx, cy, c);
    this.tri(ax, ay, cx, cy, dx, dy, c);
  }
  rect(x, y, w, h, c) { this.quad(x, y, x + w, y, x + w, y + h, x, y + h, c); }
  // Round cap / round join. 12 segments is plenty at these radii.
  disc(cx, cy, r, c, segs = 12) {
    for (let i = 0; i < segs; i++) {
      const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
      this.tri(cx, cy, cx + Math.cos(a0) * r, cy + Math.sin(a0) * r,
                       cx + Math.cos(a1) * r, cy + Math.sin(a1) * r, c);
    }
  }
  // Stroke a polyline: one expanded quad per segment, plus a disc at every vertex so
  // joins and caps read as round. Only correct because every stroke here is opaque.
  polyline(pts, width, c) {
    const hw = width / 2;
    for (let i = 0; i + 3 < pts.length; i += 2) {
      const x0 = pts[i], y0 = pts[i + 1], x1 = pts[i + 2], y1 = pts[i + 3];
      let nx = y0 - y1, ny = x1 - x0;
      const len = Math.hypot(nx, ny);
      if (len < 1e-6) continue;
      nx = (nx / len) * hw; ny = (ny / len) * hw;
      this.quad(x0 + nx, y0 + ny, x1 + nx, y1 + ny, x1 - nx, y1 - ny, x0 - nx, y0 - ny, c);
    }
    for (let i = 0; i + 1 < pts.length; i += 2) this.disc(pts[i], pts[i + 1], hw, c);
  }
  // Star-convex polygon (the sparkles) → fan from the centroid.
  fan(pts, c) {
    let cx = 0, cy = 0, n = pts.length / 2;
    for (let i = 0; i < pts.length; i += 2) { cx += pts[i]; cy += pts[i + 1]; }
    cx /= n; cy /= n;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      this.tri(cx, cy, pts[i * 2], pts[i * 2 + 1], pts[j * 2], pts[j * 2 + 1], c);
    }
  }
}

const hexToRgba = (hex, a = 1) => {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, a];
};

/* ---------- arc-length maths: how the ink gets trimmed to the drag ---------- */

function arcLengths(pts) {
  const cum = [0];
  for (let i = 0; i + 3 < pts.length; i += 2)
    cum.push(cum[cum.length - 1] + Math.hypot(pts[i + 2] - pts[i], pts[i + 3] - pts[i + 1]));
  return cum;
}

// Trim a polyline to `target` arc length, interpolating the exact tip.
function trim(pts, cum, target) {
  if (target <= 0) return [];
  const total = cum[cum.length - 1];
  if (target >= total) return pts.slice();
  const out = [pts[0], pts[1]];
  for (let s = 0; s + 1 < cum.length; s++) {
    if (cum[s + 1] < target) { out.push(pts[(s + 1) * 2], pts[(s + 1) * 2 + 1]); continue; }
    const segLen = cum[s + 1] - cum[s];
    const t = segLen < 1e-6 ? 0 : (target - cum[s]) / segLen;
    out.push(pts[s * 2] + (pts[(s + 1) * 2] - pts[s * 2]) * t,
             pts[s * 2 + 1] + (pts[(s + 1) * 2 + 1] - pts[s * 2 + 1]) * t);
    break;
  }
  return out;
}

// Point at a given arc length, plus the tangent angle there (for the arrow cursor).
function atLength(pts, cum, target) {
  const total = cum[cum.length - 1];
  const t2 = Math.max(0, Math.min(target, total));
  for (let s = 0; s + 1 < cum.length; s++) {
    if (cum[s + 1] < t2 && s + 2 < cum.length) continue;
    const segLen = cum[s + 1] - cum[s];
    const t = segLen < 1e-6 ? 0 : (t2 - cum[s]) / segLen;
    const x0 = pts[s * 2], y0 = pts[s * 2 + 1], x1 = pts[(s + 1) * 2], y1 = pts[(s + 1) * 2 + 1];
    return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, a: Math.atan2(y1 - y0, x1 - x0) };
  }
  return { x: pts[0], y: pts[1], a: 0 };
}

// Arc length of the point on the polyline closest to (px, py).
function nearestLength(pts, cum, px, py) {
  let best = Infinity, bestLen = 0;
  for (let s = 0; s + 3 < pts.length; s += 2) {
    const x0 = pts[s], y0 = pts[s + 1], dx = pts[s + 2] - x0, dy = pts[s + 3] - y0;
    const l2 = dx * dx + dy * dy;
    const t = l2 < 1e-6 ? 0 : Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / l2));
    const qx = x0 + dx * t, qy = y0 + dy * t;
    const d = (px - qx) ** 2 + (py - qy) ** 2;
    if (d < best) { best = d; bestLen = cum[s / 2] + Math.hypot(dx, dy) * t; }
  }
  return { len: bestLen, dist: Math.sqrt(best) };
}

// Split a polyline into dash sub-polylines. Konva does this with one `dash` property.
function dashify(pts, cum, pattern) {
  const [on, off] = pattern, total = cum[cum.length - 1], out = [];
  let pos = 0;
  while (pos < total) {
    const seg = trimBetween(pts, cum, pos, Math.min(pos + on, total));
    if (seg.length >= 4) out.push(seg);
    pos += on + off;
  }
  return out;
}
function trimBetween(pts, cum, a, b) {
  const head = trim(pts, cum, b);
  if (head.length < 4) return [];
  const hc = arcLengths(head), keep = hc[hc.length - 1] - a;
  if (keep <= 0) return [];
  // reverse-trim: flip, trim to `keep`, flip back
  const rev = [];
  for (let i = head.length - 2; i >= 0; i -= 2) rev.push(head[i], head[i + 1]);
  const cut = trim(rev, arcLengths(rev), keep), back = [];
  for (let i = cut.length - 2; i >= 0; i -= 2) back.push(cut[i], cut[i + 1]);
  return back;
}

/* ---------- one interactive letter ---------- */

const ARROW = [-3, -11, 3, -11, 3, 0, 8.5, 0, 0, 12, -8.5, 0, -3, 0];
const C_TRACK = '#d9e2ea', C_GUIDE = '#1c9ff2', C_INK = '#1a1a1a';

function makeLetter(host, geo, label) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${label}</h2>`;
  const canvas = document.createElement('canvas');
  card.appendChild(canvas);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = `<button>Reset</button><span class="stat"></span>`;
  card.appendChild(bar);
  host.appendChild(card);

  const W = geo.canvas.w, H = geo.canvas.h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
  if (!gl) { card.innerHTML += '<p>WebGL2 unavailable.</p>'; return; }

  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'compile failed');
    return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link failed');
  gl.useProgram(prog);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const aPos = gl.getAttribLocation(prog, 'a_pos'), aCol = gl.getAttribLocation(prog, 'a_col');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aCol);
  gl.vertexAttribPointer(aCol, 4, gl.FLOAT, false, 24, 8);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_res'), W, H);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // premultiplied — the FS multiplies rgb by a

  // Per-stroke state, precomputed once.
  const strokes = geo.guided.map((g) => {
    const cum = arcLengths(g.path);
    return { path: g.path, cum, total: cum[cum.length - 1], drawn: 0, done: false };
  });
  const dashCache = geo.dashes.map((d) => {
    const cum = arcLengths(d.pts);
    return { segs: dashify(d.pts, cum, d.dash || [15, 18]), w: d.strokeWidth || d.w || 7 };
  });

  let active = 0, dragging = false, celebrate = 0;
  const mesh = new Mesh();
  const stat = bar.querySelector('.stat');

  function build(now) {
    mesh.clear();
    for (const r of geo.rules) mesh.rect(r.x, r.y, r.w, r.h, hexToRgba(r.c));
    for (const t of geo.tracks) mesh.polyline(t.pts, t.w, hexToRgba(C_TRACK));

    // Guide dashes: only for the stroke you're on (per-stroke reveal, same as the .glam).
    dashCache.forEach((d, i) => {
      if (i !== active || strokes[i]?.done) return;
      for (const s of d.segs) mesh.polyline(s, d.w, hexToRgba(C_GUIDE));
    });

    // Ink, trimmed to how far each stroke was pulled.
    strokes.forEach((s) => {
      if (s.drawn <= 0) return;
      mesh.polyline(trim(s.path, s.cum, s.drawn), geo.ink[0].w, hexToRgba(C_INK));
    });

    // Handle + arrow at the tip of the active stroke.
    const s = strokes[active];
    if (s && !s.done) {
      const p = atLength(s.path, s.cum, s.drawn);
      mesh.disc(p.x, p.y, 22, hexToRgba(C_GUIDE), 28);
      const rot = p.a + Math.PI / 2, ca = Math.cos(rot), sa = Math.sin(rot), arr = [];
      for (let i = 0; i < ARROW.length; i += 2)
        arr.push(p.x + ARROW[i] * ca - ARROW[i + 1] * sa, p.y + ARROW[i] * sa + ARROW[i + 1] * ca);
      mesh.fan(arr, hexToRgba('#ffffff'));
    }

    // Celebration sparkles once every stroke is drawn.
    if (celebrate > 0) {
      const t = Math.min(1, (now - celebrate) / 400);
      geo.sparks.forEach((sp, i) => {
        const a = Math.max(0, Math.min(1, t * 1.6 - i * 0.06));
        if (a > 0) mesh.fan(sp.pts, hexToRgba(sp.c, a));
      });
    }
  }

  function draw(now) {
    build(now);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mesh.v), gl.DYNAMIC_DRAW);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, mesh.v.length / 6);
    const pct = Math.round((strokes.reduce((a, s) => a + s.drawn, 0) /
                            strokes.reduce((a, s) => a + s.total, 0)) * 100);
    stat.textContent = `${mesh.v.length / 6} verts · stroke ${Math.min(active + 1, strokes.length)}/${strokes.length} · ${pct}%`;
  }

  let raf = null;
  const schedule = () => { if (!raf) raf = requestAnimationFrame((t) => { raf = null; draw(t); }); };

  const toCanvas = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  };

  canvas.addEventListener('pointerdown', (e) => {
    const s = strokes[active];
    if (!s || s.done) return;
    const tip = atLength(s.path, s.cum, s.drawn);
    if (Math.hypot(e.offsetX - tip.x, e.offsetY - tip.y) > 44) return; // must grab the handle
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const s = strokes[active];
    const p = toCanvas(e);
    const n = nearestLength(s.path, s.cum, p.x, p.y);
    if (n.dist > 70) return;                     // wandered off the path — ignore
    s.drawn = Math.max(s.drawn, n.len);          // monotonic: the ink never un-draws
    if (s.drawn >= s.total - 2) {
      s.drawn = s.total; s.done = true; dragging = false;
      if (active < strokes.length - 1) active++;
      else { celebrate = performance.now(); animate(); }
    }
    schedule();
  });

  const endDrag = () => { dragging = false; schedule(); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function animate() {
    const step = (t) => { draw(t); if (t - celebrate < 500) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  bar.querySelector('button').addEventListener('click', () => {
    strokes.forEach((s) => { s.drawn = 0; s.done = false; });
    active = 0; celebrate = 0; dragging = false;
    schedule();
  });

  draw(performance.now());
}

const row = document.getElementById('row');
makeLetter(row, GEO.h, 'h — WebGL2');
makeLetter(row, GEO.y, 'y — WebGL2');
</script>
